[project]
name = "chat-python-client"
version = "0.1.0"
description = "Interactive WebSocket chat client"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.11,<4", "pydantic>=2.10,<3"]

[project.scripts]
chat-python = "chat_client.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chat_client"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ASYNC"]
